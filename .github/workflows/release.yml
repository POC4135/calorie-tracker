name: Release

# Publishes a GitHub release whenever the version in .claude-plugin/plugin.json changes on main
# (or when run by hand). Bump the version, update CHANGELOG.md, and merge: the release follows.
on:
  push:
    branches: [main]
    paths: [".claude-plugin/plugin.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Read the version
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; bump the version in plugin.json to publish a new one."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dev tools
        if: steps.version.outputs.exists == 'false'
        run: pip install -r requirements-dev.txt
      - name: Test
        if: steps.version.outputs.exists == 'false'
        run: python -m pytest -q
      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: python tools/build.py package
      - name: Publish the GitHub release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python tools/build.py notes "$VERSION" > notes.md
          gh release create "v$VERSION" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Katori v$VERSION" --notes-file notes.md
