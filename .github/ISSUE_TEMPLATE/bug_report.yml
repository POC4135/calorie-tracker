name: Something went wrong
description: A skill misbehaved, a calculation looks wrong, or installation failed.
labels: ["bug"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - claude.ai or desktop app (marketplace)
        - claude.ai or desktop app (uploaded zip)
        - Claude Code
        - Another agent
        - Claude API
    validations:
      required: true
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - macro-tracker
        - recipe-macros
        - menu-macros
        - meal-planner
        - Installation
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you sent and what happened
      description: Paste your message and Claude's reply. Remove anything personal you do not want public.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: Katori version
      description: From the release you installed, or the version in plugin.json.
